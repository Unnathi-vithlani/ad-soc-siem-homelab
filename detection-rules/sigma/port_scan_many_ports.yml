title: Outbound Connection
id: 6f1c0a52-3b7e-4c1d-9a41-2d8e5b7c1a04
name: network_connection_any
status: experimental
description: Any Sysmon TCP network connection event (inbound or outbound). Used by the port scan correlation rule below. No Initiated filter, because a scan against a host is logged there as an inbound connection (Initiated=false).
author: Unnathi Vithlani
date: 2026-10-03
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        EventID: 3
        Protocol: 'tcp'
    condition: selection
level: low
---
title: Possible Port Scan, Many Destination Ports From One Source
id: 6f1c0a52-3b7e-4c1d-9a41-2d8e5b7c1a05
status: experimental
description: One source contacts more than 10 distinct destination ports within one minute. Mirrors the Port Scan Detected alert in ad-soc-siem-homelab.
references:
    - https://attack.mitre.org/techniques/T1046/
author: Unnathi Vithlani
date: 2026-10-03
tags:
    - attack.discovery
    - attack.t1046
correlation:
    type: value_count
    rules:
        - network_connection_any
    group-by:
        - SourceIp
    timespan: 1m
    condition:
        field: DestinationPort
        gt: 10
falsepositives:
    - Vulnerability scanners and asset discovery tools (allow-list their source IPs)
    - Monitoring systems that poll many ports
level: medium
